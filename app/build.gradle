plugins {
    id 'com.android.application'
}

android {
    namespace 'com.srj.goldloan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.srj.goldloan'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
